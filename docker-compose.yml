services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - sqlite_data:/app/database_persistent
      - app_storage:/app/storage
    expose:
      - "8080"
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:

volumes:
  sqlite_data:
  app_storage:
  caddy_data:
  caddy_config:
